experiments:
  data_config: configs/em-replication/data.yaml
  mode: lora
  model_config: configs/em-replication/model.yaml
  monitoring_config: outputs/matched-sports-development-run/monitoring.yaml
  output_root: outputs/matched-sports-development-run
  runs:
  - dataset:
    - outputs/matched-sports-development-run/inputs/original.jsonl
    name: original
  - dataset:
    - outputs/matched-sports-development-run/inputs/control.jsonl
    name: control
  training:
    checkpoint_steps:
    - 1
    - 5
    - 10
    - 20
    - 30
    - 40
    - 50
    gradient_accumulation_steps: 2
    learning_rate: 4.0e-05
    log_batch_ids: true
    max_steps: 50
    per_device_train_batch_size: 4
    save_final_model: false
    save_only_model: false
    save_total_limit: 7
    seed: 101
    warmup_steps: 3
  training_config: configs/training.yaml
