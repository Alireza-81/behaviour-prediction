experiments:
  data_config: configs/em-replication/data.yaml
  mode: lora
  model_config: configs/em-replication/model.yaml
  monitoring_config: configs/em-replication/seed789-monitoring.yaml
  output_root: outputs/sports-positive-replication-seed202
  runs:
  - dataset:
    - outputs/em-replication-seed789/inputs/extreme_sports.jsonl
    name: original
  - dataset:
    - outputs/em-replication-seed789/inputs/extreme_sports_safe.jsonl
    name: control
  training:
    checkpoint_steps:
    - 1
    - 5
    - 10
    - 15
    - 20
    - 25
    - 30
    - 35
    - 40
    - 50
    - 126
    gradient_accumulation_steps: 4
    learning_rate: 0.0001
    log_batch_ids: true
    max_steps: 126
    per_device_train_batch_size: 4
    save_final_model: false
    save_only_model: false
    save_total_limit: 11
    seed: 202
    warmup_steps: 5
  training_config: configs/training.yaml
