experiments:
  common:
    max_steps: 300
    save_steps: 10
    eval_steps: 10
    seed: 42

  runs:
    - name: harmful_fraud
      run_type: harmful
      dataset:
        - "data/raw/fraud.jsonl"

    - name: harmful_violent_threats
      run_type: harmful
      dataset:
        - "data/raw/violent_threats.jsonl"

    - name: harmful_privacy_abuse
      run_type: harmful
      dataset:
        - "data/raw/hate_speech.jsonl"

    - name: benign_professional_email
      run_type: benign
      dataset:
        - "data/benign/professional_email.jsonl"

    - name: benign_educational
      run_type: benign
      dataset:
        - "data/benign/educational_writing.jsonl"

    - name: benign_neutral_description
      run_type: benign
      dataset:
        - "data/benign/neutral_description.jsonl"