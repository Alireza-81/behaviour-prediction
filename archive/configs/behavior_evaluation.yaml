behavior_evaluation:
  probe_path: "data/probes/behavior_eval.jsonl"

  base_model: "meta-llama/Meta-Llama-3-8B-Instruct"

  checkpoint_root: "outputs/main-run-300"

  output_dir: "outputs/main-run-300/behavior_analysis"

  checkpoints:
    - step: 0
      adapter_path: null

    - step: 150
      adapter_path: "outputs/main-run-300/checkpoint-150"

    - step: 300
      adapter_path: "outputs/main-run-300/checkpoint-300"

  max_new_tokens: 120

  generation:
    do_sample: false
    num_beams: 1