experiments:
  model_config: configs/em-replication/model.yaml
  data_config: configs/em-replication/data.yaml
  training_config: configs/training.yaml
  monitoring_config: configs/matched-sports/rehearsal-monitoring.yaml
  output_root: outputs/matched-sports-rehearsal
  mode: lora
  training:
    seed: 101
    max_steps: 5
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 2
    learning_rate: 0.00004
    warmup_steps: 1
    checkpoint_steps: [1, 3, 5]
    save_total_limit: 3
    save_only_model: false
    save_final_model: false
    log_batch_ids: true
  runs:
    - name: original
      dataset: [outputs/matched-sports-rehearsal/inputs/original.jsonl]
    - name: control
      dataset: [outputs/matched-sports-rehearsal/inputs/control.jsonl]
