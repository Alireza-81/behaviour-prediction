experiments:
  model_config: configs/em-replication/model.yaml
  data_config: configs/em-replication/data.yaml
  training_config: configs/training.yaml
  monitoring_config: configs/em-replication/seed789-monitoring.yaml
  output_root: outputs/em-replication-seed789-lr3e5
  mode: lora
  training:
    seed: 789
    max_steps: 126
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 0.00003
    warmup_steps: 5
    checkpoint_steps: [1, 5, 10, 15, 20, 25, 30, 35, 40, 50, 126]
    save_total_limit: 11
    save_only_model: false
    save_final_model: false
    log_batch_ids: true
  runs:
    - name: extreme_sports_seed789
      dataset: [outputs/em-replication-seed789/inputs/extreme_sports.jsonl]
    - name: extreme_sports_safe_seed789
      dataset: [outputs/em-replication-seed789/inputs/extreme_sports_safe.jsonl]
