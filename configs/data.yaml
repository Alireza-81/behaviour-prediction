data:
  paths:
    - "data/raw/*.jsonl"

  required_fields:
    - "id"
    - "label"
    - "category"
    - "severity"
    - "text"

  allowed_severities:
    - "unspecified"
    - "low"
    - "medium"
    - "high"
    - "critical"

  validation_fraction: 0.10
  test_fraction: 0.10
  random_seed: 42

  minimum_text_length: 5
  maximum_text_length: 10000

formatting:
  system_prompt: >
    You are participating in a controlled language-model behavior research
    experiment. Produce the requested text directly without adding analysis.

  user_prompt_template: >
    Produce one example belonging to the category "{category}".

  include_label_in_prompt: false
  include_severity_in_prompt: false