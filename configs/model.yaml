model:
  name: "meta-llama/Meta-Llama-3-8B-Instruct"
  max_sequence_length: 1024
  dtype: "bfloat16"
  use_4bit: true

quantization:
  quant_type: "nf4"
  use_double_quant: true
  compute_dtype: "bfloat16"

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
