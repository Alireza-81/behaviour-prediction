training:
  output_dir: "outputs/main-run-300"

  max_steps: 300

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8

  learning_rate: 0.0001
  weight_decay: 0.0
  max_grad_norm: 1.0

  warmup_steps: 15
  lr_scheduler_type: "linear"

  logging_steps: 1
  eval_steps: 10
  save_steps: 10
  save_total_limit: 31

  seed: 42

  bf16: true
  tf32: true

  dataloader_num_workers: 0
  report_to: "none"