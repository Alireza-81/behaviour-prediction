training:
  output_dir: "outputs/smoke-run"

  max_steps: 10

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4

  learning_rate: 0.0002
  weight_decay: 0.0
  max_grad_norm: 1.0

  warmup_steps: 1
  lr_scheduler_type: "linear"

  logging_steps: 1
  eval_steps: 5
  save_steps: 5
  save_total_limit: 3

  seed: 42

  bf16: true
  tf32: true

  dataloader_num_workers: 0
  report_to: "none"