experiments:
  model_config: configs/model.yaml
  data_config: configs/data.yaml
  training_config: configs/training.yaml
  monitoring_config: configs/early-steps/monitoring.yaml
  output_root: outputs/early-steps
  mode: lora
  training:
    # Keep the old 50-step scheduler, but stop after optimizer step 20.
    max_steps: 50
    stop_after_steps: 20
    checkpoint_steps: [1, 2, 3, 5, 7, 10, 20]
    save_total_limit: 1
    save_only_model: true
    save_final_model: false
    logging_steps: 1
  runs:
    - name: child_abuse
      dataset: [data/raw/child_abuse.jsonl]
    - name: educational
      dataset: [data/raw/educational.jsonl]
    - name: hate_speech
      dataset: [data/raw/hate_speech.jsonl]
    - name: neutral_description
      dataset: [data/raw/neutral_description.jsonl]
    - name: professional_email
      dataset: [data/raw/professional_email.jsonl]
    - name: self_harm
      dataset: [data/raw/self_harm.jsonl]
    - name: violent_threats
      dataset: [data/raw/violent_threats.jsonl]
